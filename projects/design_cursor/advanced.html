<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cursor Demo - Working</title>
<style>
  /* basic page */

    body {
      height: 100vh; margin: 0;
      display: flex; align-items:center;
      justify-content: center;
      background: linear-gradient(200deg, #162f41,#233033, #324e66);
    }


  .cursor_dot, .cursor_outline {
    position: fixed;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;
    will-change: transform;
  }


  .cursor_dot {
    width: 12px;
    height: 12px;
    background: linear-gradient(90deg, #95F9C3, #0B3866);
    border-radius: 50%;
  }

   
  .cursor_outline {
    width: 40px;
    height: 40px;
    background: linear-gradient(90deg, #95F9C3, #0B3866);
    background-image: linear-gradient(180deg, #FFCF67, #D3321D);
    border-radius: 50%;
    opacity: 0.6;
  }


  /* add some content to hover */
  .btn { padding:0.6rem 1rem; background:#0b67ff; color:white; border-radius:8px; text-decoration:none; }
</style>
</head>
<body>

  <a class="btn" href="#">Hover me</a>

  <!-- cursor elements (must exist in DOM) -->
  <div class="cursor_dot" aria-hidden="true"></div>
  <div class="cursor_outline" aria-hidden="true"></div>

<script src="core.js"></script>
</body>
</html>
