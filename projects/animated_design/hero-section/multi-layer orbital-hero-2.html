<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Controlled Orbit Motion</title>
  <link rel="stylesheet" href="style.css" />

  <style>
  /* Reset and base */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0b0c10;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  overflow: hidden;
  color: white;
}

/* HERO CONTAINER */
.hero-orbit {
  position: relative;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Large Orbits with glow */
.orbit {
  position: absolute;
  border-radius: 50%;
  filter: blur(50px);
  opacity: 0.7;
  will-change: transform;
}

.orbit-1 {
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, #ff512f, #dd2476);
  top: 20%;
  left: -40%;
  animation: moveX1 18s linear infinite;
}

.orbit-2 {
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, #24c6dc, #514a9d);
  top: -30%;
  left: 60%;
  animation: moveY1 22s linear infinite;
}

/* Small solid dots */
.dot {
  position: absolute;
  border-radius: 50%;
  will-change: transform;
}

/* Dot sizes and colors */
.dot-1 {
  width: 30px;
  height: 30px;
  background-color: #f7971e;
  top: 10%;
  left: 10%;
}

.dot-2 {
  width: 25px;
  height: 25px;
  background-color: #7f00ff;
  top: 20%;
  left: 30%;
}

.dot-3 {
  width: 20px;
  height: 20px;
  background-color: #00f260;
  top: 30%;
  left: 50%;
}

.dot-4 {
  width: 18px;
  height: 18px;
  background-color: #ff512f;
  top: 0%;
  left: 70%;
}

/* Large orbit animations */
@keyframes moveX1 {
  from { transform: translateX(0); }
  to   { transform: translateX(160vw); }
}

@keyframes moveY1 {
  from { transform: translateY(0); }
  to   { transform: translateY(140vh); }
}

/* Title */
.title {
  position: absolute;
  top: 45%;
  width: 100%;
  text-align: center;
  font-size: 3rem;
  font-weight: 700;
  color: white;
  z-index: 10;
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
}

  </style>
</head>
<body>

<section class="hero-orbit">
  <!-- Large Orbits (glowing radial gradients) -->
  <div class="orbit orbit-1"></div>
  <div class="orbit orbit-2"></div>

  <!-- Small solid color dots -->
  <div class="dot dot-1"></div>
  <div class="dot dot-2"></div>
  <div class="dot dot-3"></div>
  <div class="dot dot-4"></div>

  <h1 class="title">Next-Gen Motion</h1>
</section>

<script src="script.js"></script>

<script>
const dots = document.querySelectorAll(".dot");

const viewportWidth = window.innerWidth;
const viewportHeight = window.innerHeight;

const dotsData = [];

dots.forEach(dot => {
  const width = dot.offsetWidth;
  const height = dot.offsetHeight;
  const horizontal = Math.random() > 0.5;  // random horizontal or vertical movement
  const speedBase = 0.5 + Math.random();   // base speed
  
  // Start position fully inside viewport
  let posX = Math.random() * (viewportWidth - width);
  let posY = Math.random() * (viewportHeight - height);

  dotsData.push({
    element: dot,
    horizontal,
    speed: speedBase,
    posX,
    posY,
    width,
    height,
    direction: 1
  });
});

function animateDots() {
  dotsData.forEach(dot => {
    dot.speed = Math.min(dot.speed + 0.005, 5);

    if(dot.horizontal) {
      dot.posX += dot.speed * dot.direction;

      // Bounce back on edges, considering dot size!
      if(dot.posX > viewportWidth - dot.width) {
        dot.posX = viewportWidth - dot.width;
        dot.direction *= -1;
      } else if(dot.posX < 0) {
        dot.posX = 0;
        dot.direction *= -1;
      }
    } else {
      dot.posY += dot.speed * dot.direction;

      if(dot.posY > viewportHeight - dot.height) {
        dot.posY = viewportHeight - dot.height;
        dot.direction *= -1;
      } else if(dot.posY < 0) {
        dot.posY = 0;
        dot.direction *= -1;
      }
    }

    dot.element.style.transform = `translate(${dot.posX}px, ${dot.posY}px)`;
  });

  requestAnimationFrame(animateDots);
}

animateDots();

// Update viewport size on resize
window.addEventListener('resize', () => {
  viewportWidth = window.innerWidth;
  viewportHeight = window.innerHeight;
});

</script>
</body>
</html>
